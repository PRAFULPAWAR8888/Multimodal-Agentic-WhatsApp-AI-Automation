[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-agent"
version = "0.1.0"
description = "Multimodal Agentic WhatsApp AI Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "arq>=0.26.1",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "openai>=1.50.0",
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "sentence-transformers>=3.1.1",
    "pgvector>=0.3.3",
    "faster-whisper>=1.0.3",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "pymupdf>=1.24.10",
    "pdfplumber>=0.11.4",
    "paddleocr>=2.8.1",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "aiortc>=1.9.0",
    "fastmcp>=0.1.0",
    "langdetect>=1.0.9",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "python-magic>=0.4.27",
    "cryptography>=43.0.0",
    "ulid-py>=1.1.0",
    "tiktoken>=0.14.0",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
